  @media (max-width: 640px) {

  .rise-in { animation: riseIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }

  .pop-in { animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes slideLeftIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

  button { transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease; }

function useClickOutside(ref, onOutside) {
  useEffect(() => {
    function handler(e) { if (ref.current && !ref.current.contains(e.target)) onOutside(); }
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [ref, onOutside]);
}

// Generic, reusable dropdown: measures the trigger's position on open and
// flips left/right alignment automatically so the panel never runs off-screen,
// regardless of where in the layout it's mounted.
function Dropdown({ trigger, panelWidth = 220, children }) {
  const [open, setOpen] = useState(false);
  const wrapperRef = useRef(null);
  const triggerRef = useRef(null);
  const [pos, setPos] = useState(null);
  useClickOutside(wrapperRef, () => setOpen(false));

  function computePos() {
    if (!triggerRef.current) return { top: 0, left: 0 };
    const rect = triggerRef.current.getBoundingClientRect();
    const margin = 12;
    let left = rect.left;
    if (left + panelWidth > window.innerWidth - margin) left = rect.right - panelWidth;
    if (left < margin) left = margin;
    return { top: rect.bottom + 8, left };
  }

  function toggle() {
    if (open) { setOpen(false); return; }
    setPos(computePos()); // measure before showing, so it never flashes at the wrong spot
    setOpen(true);
  }

  return (
    <div ref={wrapperRef} style={{ display: "inline-block" }}>
      <span ref={triggerRef} style={{ display: "inline-block" }}>
        {trigger({ open, toggle })}
      </span>
      {open && pos && (
        <div className="fade-in" style={{ ...dropdownPanelStyle, top: pos.top, left: pos.left, minWidth: panelWidth }} onClick={() => setOpen(false)}>
          {children}
        </div>
      )}
    </div>
  );
}

}

function CallStep({ engagement, agenda, setAgenda, observations, setObservations, onEndCall }) {
  const script = CALL_SCRIPT[engagement.id] || [];
  const [lineIndex, setLineIndex] = useState(0);
  const [autoplay, setAutoplay] = useState(false);
  const [pendingMatch, setPendingMatch] = useState(null);
  const [muted, setMuted] = useState(false);
  const [onHold, setOnHold] = useState(false);
  const [keypadOpen, setKeypadOpen] = useState(false);
  const [transferModalOpen, setTransferModalOpen] = useState(false);
  const [transferState, setTransferState] = useState("idle");
  const [swapActive, setSwapActive] = useState("customer");
  const [addingObs, setAddingObs] = useState(false);
  const [obsDraft, setObsDraft] = useState("");

  function addManualObservation() {
    if (!obsDraft.trim()) return;
    setObservations((prev) => [...prev, { id: `custom-${Date.now()}`, text: obsDraft.trim(), status: "confirmed", custom: true }]);
    setObsDraft("");
    setAddingObs(false);
  }
  const scrollRef = useRef(null);
  const transferring = transferState !== "idle" && transferState !== "done";

  function callQuickConnect() {
    setTransferState("calling");
    setOnHold(true);
    setTimeout(() => setTransferState("connected"), 1400);
  }
  function joinConference() { setTransferState("conference"); setOnHold(false); }
  function leaveCall() { setTransferState("done"); setOnHold(false); }

  useEffect(() => {
    if (!autoplay || onHold) return;
    if (lineIndex >= script.length) { setAutoplay(false); return; }
    const t = setTimeout(() => advance(), 2200);
    return () => clearTimeout(t);
  }, [autoplay, lineIndex, onHold]);
  useEffect(() => { scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" }); }, [lineIndex, pendingMatch]);

  function advance() {
    if (lineIndex >= script.length) return;
    const line = script[lineIndex];
    if (line.match) {
      setAgenda((prev) => {
        if (prev.some((a) => a.id === line.match)) return prev;
        const suggestion = engagement.aiAgendaSuggestions.find((s) => s.id === line.match);
        return suggestion ? [...prev, { id: suggestion.id, label: suggestion.label, source: "ai", status: "pending" }] : prev;
      });
      setPendingMatch(line.match);
    }
    if (line.confirm) setAgenda((prev) => prev.map((a) => (a.id === line.confirm ? { ...a, status: "confirmed" } : a)));
    if (line.observation) setObservations((prev) => [...prev, { id: `o${prev.length}-${Date.now()}`, text: line.observation, status: "suggested", blockedFax: line.blockedFax || null }]);
    setLineIndex((i) => i + 1);
  }
  function resolveMatch(decision) {
    if (decision === "confirm") setAgenda((prev) => prev.map((a) => (a.id === pendingMatch ? { ...a, status: "confirmed" } : a)));
    setPendingMatch(null);
  }
  function resolveObservation(id, decision) {
    setObservations((prev) => decision === "discard" ? prev.filter((o) => o.id !== id) : prev.map((o) => (o.id === id ? { ...o, status: "confirmed" } : o)));
  }
  const noScript = script.length === 0;

  return (
    <div className="rise-in">
      <p style={{ ...sans, color: C.inkMuted }} className="text-sm mb-3">Live now 🎙️</p>
      <div className="flex flex-col md:flex-row gap-6">
        <div className="w-full md:w-64 flex-shrink-0 flex flex-col gap-4">
          <Panel>
            <div style={{ ...sans, color: C.inkMuted }} className="text-xs font-medium mb-3 uppercase tracking-wide">Agenda</div>
            <ul className="flex flex-col gap-2">
              {agenda.map((a) => (
                <li key={a.id} className="flex items-start gap-2">
                  {a.status === "confirmed" ? <span key={a.id + "-c"} className="pop-in" style={{ display: "inline-flex" }}><CheckCircle2 size={15} color={C.green} /></span> : <Circle size={15} color={C.border} />}
                  <span style={{ ...sans, color: a.status === "confirmed" ? C.ink : C.inkMuted, transition: "color 0.4s ease" }} className="text-sm">{a.label}</span>
                </li>
              ))}
            </ul>
          </Panel>
          <Panel>
            <div style={{ ...sans, color: C.inkMuted }} className="text-xs font-medium mb-3 uppercase tracking-wide">New observations</div>
            {observations.length === 0 && !addingObs && <p style={{ ...sans, color: C.inkMuted }} className="text-sm">None yet.</p>}
            <ul className="flex flex-col gap-2 mb-2">
              {observations.map((o) => (
                <li key={o.id} style={{ background: o.status === "suggested" ? C.amberSoft : C.greenSoft }} className="p-2 rounded-sm">
                  <p style={{ ...sans, color: C.ink }} className="text-sm mb-1.5">{o.text}</p>
                  {o.status === "suggested" ? (
                    <div className="flex gap-2">
                      <button onClick={() => resolveObservation(o.id, "confirm")} style={{ ...sans, color: C.green }} className="text-xs font-medium py-1.5 -my-1.5">Keep</button>
                      <button onClick={() => resolveObservation(o.id, "discard")} style={{ ...sans, color: C.inkMuted }} className="text-xs font-medium py-1.5 -my-1.5">Discard</button>
                    </div>
                  ) : (
                    <div className="flex items-center gap-2">
                      <Badge tone="green">Confirmed</Badge>
                      {o.custom && <Badge tone="primary"><User size={11} /> Added by you</Badge>}
                    </div>
                  )}
                </li>
              ))}
            </ul>
            {addingObs ? (
              <div className="fade-in flex flex-col gap-2">
                <textarea
                  autoFocus value={obsDraft} onChange={(e) => setObsDraft(e.target.value)} placeholder="What did you notice?"
                  style={{ ...sans, borderColor: C.border, color: "#FFFFFF" }} className="w-full text-sm p-2 border rounded-sm" rows={2}
                />
                <div className="flex items-center gap-2">
                  <GhostButton onClick={addManualObservation}><Check size={13} color={C.green} /> Add</GhostButton>
                  <GhostButton onClick={() => { setAddingObs(false); setObsDraft(""); }}>Cancel</GhostButton>
                </div>

          {transferState !== "idle" && (

              {transferState !== "done" && <TextLink onClick={() => setTransferModalOpen(true)}>Open transfer panel</TextLink>}

// ---------- REVIEW ----------
function ReviewStep({ engagement, agenda, followUps, setFollowUps, onBack, onProceed }) {
  const unresolved = agenda.filter((a) => a.status !== "confirmed");
  const [editingId, setEditingId] = useState(null);
  const [draft, setDraft] = useState("");
  const [adding, setAdding] = useState(false);
  const decide = (id, status) => setFollowUps((prev) => prev.map((f) => (f.id === id ? { ...f, status } : f)));
  const save = (id) => { setFollowUps((prev) => prev.map((f) => (f.id === id ? { ...f, label: draft, status: "approved" } : f))); setEditingId(null); };
  const remove = (id) => setFollowUps((prev) => prev.filter((f) => f.id !== id));
  const resolveBlocked = (id, resolvedName) => setFollowUps((prev) => prev.map((f) => (f.id === id ? { ...f, status: "pending", resolvedNote: `${resolvedName} added to care team.` } : f)));
  const addCustom = ({ type, label, recipient }) => {
    setFollowUps((prev) => [...prev, { id: `custom-${Date.now()}`, type, label, recipient, status: "approved", custom: true }]);
    setAdding(false);
  };
  const allDecided = followUps.every((f) => f.status === "approved" || f.status === "rejected");
  const typeLabel = { "data-entry": "Data entry", "new-task": "New task", fax: "Fax" };

  return (
    <div className="rise-in max-w-2xl">
      <p style={{ ...sans, color: C.inkMuted }} className="text-sm mb-3">Nice call! Let's wrap it up. Approve, edit, or skip each item — or toss in your own.</p>
      {unresolved.length > 0 && (
        <Panel className="mb-4" style={{ background: C.amberSoft, borderColor: C.amber }}>
          <p style={{ ...sans, color: C.ink }} className="text-sm">Not covered on the call: {unresolved.map((u) => u.label).join(", ")}</p>
        </Panel>
      )}
      <div className="flex flex-col gap-3 mb-5">
        {followUps.length === 0 && !adding && <Panel><p style={{ ...sans, color: C.inkMuted }} className="text-sm">Nothing yet — add one below if something came up. 👇</p></Panel>}
        {followUps.map((f) => {
          const UnblockComponent = f.status === "blocked" ? UNBLOCK_COMPONENTS[f.precondition?.component] : null;
          return (
          <Panel key={f.id}>
            <div className="flex items-center flex-wrap gap-2 mb-2">
              <Badge tone={f.type === "fax" ? "amber" : "muted"}>{typeLabel[f.type]}</Badge>
              {f.recipient && <span style={{ ...sans, color: C.inkMuted }} className="text-xs">to {f.recipient}</span>}
              {f.custom && <Badge tone="primary"><User size={11} /> Added by you</Badge>}
              <button onClick={() => remove(f.id)} style={{ marginLeft: "auto" }} className="p-2 -m-2" title="Delete this item">
                <Trash size={14} color={C.inkFaint} />
              </button>
            </div>
            {editingId === f.id ? (
              <textarea value={draft} onChange={(e) => setDraft(e.target.value)} style={{ ...sans, borderColor: C.border, color: "#FFFFFF" }} className="w-full text-sm p-2 border rounded-sm mb-2" rows={2} />
            ) : <p style={{ ...sans, color: C.ink }} className="text-sm mb-3">{f.label}</p>}

            {f.resolvedNote && (
              <p style={{ ...sans, color: C.green }} className="text-xs mb-2 flex items-center gap-1.5"><CheckCircle2 size={12} /> {f.resolvedNote}</p>
            )}

            {f.status === "blocked" && UnblockComponent && (
              <UnblockComponent engagement={engagement} data={f.precondition.data} onResolved={(name) => resolveBlocked(f.id, name)} />
            )}

            {f.status !== "blocked" && (
              <div className="flex items-center gap-2">
                {editingId === f.id ? (
                  <>
                    <PrimaryButton onClick={() => save(f.id)}>Save</PrimaryButton>
                    <GhostButton onClick={() => setEditingId(null)}>Cancel</GhostButton>
                  </>
                ) : (
                  <>
                    {f.status === "pending" && (
                      <>
                        <GhostButton onClick={() => decide(f.id, "approved")}><Check size={13} color={C.green} /> Approve</GhostButton>
                        <GhostButton onClick={() => { setEditingId(f.id); setDraft(f.label); }}><Pencil size={13} /> Edit</GhostButton>
                        <GhostButton tone="danger" onClick={() => decide(f.id, "rejected")}><X size={13} /> Skip</GhostButton>
                      </>
                    )}
                    {f.status === "approved" && (
                      <>
                        <Badge tone="green">Approved</Badge>
                        <button onClick={() => { setEditingId(f.id); setDraft(f.label); }} title="Edit" className="p-2 -m-2"><Pencil size={13} color={C.inkFaint} /></button>
                      </>
                    )}
                    {f.status === "rejected" && (
                      <>
                        <Badge tone="muted">Skipped</Badge>
                        <button onClick={() => decide(f.id, "approved")} title="Bring it back" className="p-2 -m-2"><RotateCcw size={13} color={C.inkFaint} /></button>
                      </>
                    )}
                  </>
                )}
              </div>
            )}
          </Panel>
          );
        })}
        {adding ? (
          <AddFollowUpForm onAdd={addCustom} onCancel={() => setAdding(false)} />
        ) : (
          <GhostButton onClick={() => setAdding(true)}><Plus size={13} /> Add your own item</GhostButton>
        )}
      </div>
      <div className="flex items-center gap-3">
        <GhostButton onClick={onBack}>Back</GhostButton>
        <PrimaryButton disabled={!allDecided} onClick={onProceed} icon={ChevronRight}>On to faxing</PrimaryButton>
      </div>
    </div>
  );
}

// ---------- FAX ----------
function FaxStep({ followUps, setFollowUps, onFinish }) {
  const faxes = followUps.filter((f) => f.type === "fax" && f.status === "approved");
  const [drafts, setDrafts] = useState(() => Object.fromEntries(faxes.map((f) => [f.id, f.label])));
  const send = (id) => setFollowUps((prev) => prev.map((f) => (f.id === id ? { ...f, sent: true } : f)));
  const allSent = faxes.length === 0 || faxes.every((f) => f.sent);

  return (
    <div className="rise-in max-w-2xl">
      <p style={{ ...sans, color: C.inkMuted }} className="text-sm mb-3">
        {faxes.length === 0 ? "Nothing to fax — you're clear! 🙌" : "Almost there — check it, then send 🚀"}
      </p>
      <div className="flex flex-col gap-3 mb-5">
        {faxes.map((f) => (
          <Panel key={f.id}>
            <div style={{ ...sans, color: C.inkMuted }} className="text-xs mb-2">To: {f.recipient}</div>
            <textarea value={drafts[f.id]} onChange={(e) => setDrafts((d) => ({ ...d, [f.id]: e.target.value }))} disabled={f.sent} style={{ ...sans, borderColor: C.border, color: "#FFFFFF" }} className="w-full text-sm p-2 border rounded-sm mb-2" rows={2} />
            {f.sent ? <Badge tone="green"><Check size={12} /> Sent</Badge> : <PrimaryButton onClick={() => send(f.id)} icon={Send}>Send fax</PrimaryButton>}
          </Panel>
        ))}
      </div>
      <PrimaryButton disabled={!allSent} onClick={onFinish} icon={RotateCcw}>Done! Find next 🎉</PrimaryButton>
    </div>
  );
}

    </div>
  );
}

function WorkflowAssistant() {
  const [role, setRole] = useState("caller"); // caller | manager
  const [status, setStatus] = useState("available");
  const [account, setAccount] = useState(ACCOUNTS[0]);
  const [phase, setPhase] = useState("welcome"); // welcome | break | loading | found | prep | call | review | fax
  const [candidateIdx, setCandidateIdx] = useState(0);
  const [engagement, setEngagement] = useState(null);
  const [agenda, setAgenda] = useState([]);
  const [observations, setObservations] = useState([]);
  const [followUps, setFollowUps] = useState([]);
  const [completedCount, setCompletedCount] = useState(0);
  const [recap, setRecap] = useState([]);

  function startSearch() {
    setRecap([]);
    setCandidateIdx(0);
    setPhase("loading");
    setTimeout(() => { setEngagement(QUEUE[0]); setPhase("found"); }, 2200);
  }
  function showAnother() {
    const next = (candidateIdx + 1) % QUEUE.length;
    setCandidateIdx(next);
    setEngagement(QUEUE[next]);
  }
  function goPrep() {
    setAgenda(engagement.tasks.map((t) => ({ id: t.id, label: t.label, status: "pending", source: "task" })));
    setRecap((r) => [...r, `Found ${engagement.name} — ${engagement.priority.toLowerCase()} priority, ${engagement.reason.toLowerCase()}`]);
    setPhase("prep");
  }
  function startCall() {
    setObservations([]);
    setRecap((r) => [...r, `Prepped — ${agenda.length} agenda item${agenda.length === 1 ? "" : "s"} ready`]);
    setStatus("on_call");
    setPhase("call");
  }
  function endCall() {
    const confirmedIds = new Set(agenda.filter((a) => a.status === "confirmed").map((a) => a.id));
    const generated = [];
    agenda.forEach((a) => { if (confirmedIds.has(a.id) && FOLLOWUP_RULES[a.id]) { const r = FOLLOWUP_RULES[a.id]; generated.push({ id: `f-${a.id}`, type: r.type, label: r.label, recipient: r.recipient, status: "pending" }); } });
    observations.forEach((o) => {
      if (o.blockedFax) {
        generated.push({
          id: `f-${o.id}`, type: "fax", label: o.blockedFax.label, recipient: o.blockedFax.entityName,
          status: "blocked",
          precondition: { component: "add_care_team_member", data: { entityName: o.blockedFax.entityName, role: o.blockedFax.role } },
        });
      } else {
        generated.push({ id: `f-${o.id}`, type: "data-entry", label: `Update record: ${o.text}`, status: "pending" });
      }
    });
    setFollowUps(generated);
    setRecap((r) => [...r, `Call complete — ${confirmedIds.size} agenda item${confirmedIds.size === 1 ? "" : "s"} confirmed, ${observations.length} new note${observations.length === 1 ? "" : "s"}`]);
    setStatus("available");
    setPhase("review");
  }
  function proceedToFax() {
    const approved = followUps.filter((f) => f.status === "approved").length;
    setRecap((r) => [...r, `Reviewed — ${approved} follow-up${approved === 1 ? "" : "s"} approved`]);
    setPhase("fax");
  }
  function finishEngagement() {
    setCompletedCount((c) => c + 1);
    setEngagement(null); setAgenda([]); setObservations([]); setFollowUps([]); setRecap([]);
    setPhase("welcome");
  }
  function goOnBreak() {
    setStatus("break");
    setPhase("break");
  }
  function backFromBreak() {
    setStatus("available");
    setPhase("welcome");
  }

  const wide = phase === "call" || phase === "prep";
  const toggleRole = () => setRole((r) => (r === "caller" ? "manager" : "caller"));

  if (role === "manager") {
    return <ManagerShell onToggleRole={toggleRole} />;
  }

  return (
    <div style={{ background: C.bg, minHeight: "100vh", position: "relative", overflow: "hidden" }}>
      <div className="blob" style={{ position: "absolute", top: "-10%", right: "-10%", width: 500, height: 500, borderRadius: "50%", background: "#FF5DA2", opacity: 0.35, filter: "blur(90px)", animation: "drift1 18s ease-in-out infinite" }} />
      <div className="blob" style={{ position: "absolute", top: "30%", left: "-15%", width: 460, height: 460, borderRadius: "50%", background: "#8B7CF6", opacity: 0.3, filter: "blur(90px)", animation: "drift2 22s ease-in-out infinite" }} />
      <div className="blob" style={{ position: "absolute", bottom: "-15%", right: "10%", width: 420, height: 420, borderRadius: "50%", background: "#36E2C8", opacity: 0.25, filter: "blur(90px)", animation: "drift3 20s ease-in-out infinite" }} />
      <TopBar completedCount={completedCount} account={account} setAccount={setAccount} status={status} onGoBreak={goOnBreak} onBackFromBreak={backFromBreak} role={role} onToggleRole={toggleRole} />
      <div className={`relative mx-auto px-4 sm:px-8 pb-10 ${wide ? "max-w-5xl" : "max-w-xl"}`} style={{ paddingTop: 88 }}>
        <RecapTrail items={recap} />

        {phase === "welcome" && <WelcomeScreen name="Dana" completedCount={completedCount} onFind={startSearch} onBreak={goOnBreak} />}
        {phase === "break" && <BreakScreen onReturn={backFromBreak} />}
        {phase === "loading" && <LoaderScreen />}
        {phase === "found" && engagement && <FoundScreen engagement={engagement} onPrep={goPrep} onShowAnother={showAnother} />}
        {phase === "prep" && engagement && <PrepStep engagement={engagement} agenda={agenda} setAgenda={setAgenda} onBack={() => setPhase("found")} onStartCall={startCall} />}
        {phase === "call" && engagement && <CallStep engagement={engagement} agenda={agenda} setAgenda={setAgenda} observations={observations} setObservations={setObservations} onEndCall={endCall} />}
        {phase === "review" && <ReviewStep engagement={engagement} agenda={agenda} followUps={followUps} setFollowUps={setFollowUps} onBack={() => setPhase("call")} onProceed={proceedToFax} />}
        {phase === "fax" && <FaxStep followUps={followUps} setFollowUps={setFollowUps} onFinish={finishEngagement} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<WorkflowAssistant />);
</script>
